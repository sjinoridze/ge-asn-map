name: Daily refresh and publish

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      country:
        description: "Country to refresh: GE, AZ, AM or ALL (leave empty for today's rotation)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore download cache from previous runs
        uses: actions/cache@v4
        with:
          path: cache
          key: asn-cache-${{ github.run_id }}
          restore-keys: asn-cache-
      - name: Fetch RIPE data and rebuild
        env:
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
          FETCH_COUNTRY: ${{ github.event.inputs.country }}
        run: |
          python3 pipeline/fetch.py
          python3 pipeline/build.py
      - name: Commit refreshed data
        run: |
          git config user.name  "asn-map-bot"
          git config user.email "asn-map-bot@users.noreply.github.com"
          git add site/data history
          git diff --cached --quiet && exit 0
          git commit -m "Daily data refresh $(date -u +%F)"
            for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4